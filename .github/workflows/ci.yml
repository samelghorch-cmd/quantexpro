# CI QuantEXPro — pipeline bloquant : zéro test en échec = zéro merge.
# Étages : tests unitaires (invariants + goldens, rapides) → intégration (causalité
# moteur complet) → couverture avec seuils bloquants → build production.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:





jobs:
  test:
    name: Invariants · Goldens · Causalité · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Le package-lock.json est généré par npm 11 (poste dev). On aligne la CI sur le
      # même major pour que `npm ci` (résolution stricte) accepte le lockfile — sinon
      # npm 10 (défaut de Node 22) recalcule un arbre différent (esbuild 0.28 vs 0.21).
      - name: Aligner npm sur la version du lockfile
        run: npm install -g npm@11

      - name: Install (repro stricte)
        run: npm ci --ignore-scripts

      - name: Lint — règles des Hooks React (bloquant sur erreurs, warnings tolérés)
        run: npm run lint

      - name: Tests unitaires — invariants backtester + goldens métriques (<30 s)
        run: npm run test:unit

      - name: Tests d'intégration — causalité moteur + librairie complète (<2 min)
        run: npm run test:integration

      - name: Couverture — seuils bloquants (100 % annualize, ≥90 % moteur étendu)
        run: npm run coverage

      - name: Typecheck — engine TS (P2-TS incremental)
        run: npm run typecheck

      # Non-bloquant : mesure la dette de typage de la couche React (.jsx/.js).
      # Doit décroître au fil des migrations .jsx -> .tsx ; ne bloque jamais le merge.
      - name: Typecheck UI (non-bloquant — dette .jsx suivie)
        run: npm run typecheck:ui
        continue-on-error: true

      - name: Build production
        run: npm run build

  backend:
    name: Backend Python — schémas + idempotence SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (deps + dev)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests alembic

      - name: Types (mypy strict)
        working-directory: backend
        run: mypy app

      - name: Tests backend (sans DB)
        working-directory: backend
        run: python -m pytest -q
